<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Olá, Mundo!</h1>
    <div class="marquee">
        <div class="marquee-track">
            <ul class="marquee-group">
                <li>Oie</li>
                <li>Tudo bem?</li>
                <li>Como ta?</li>
                <li>Opa</li>
            </ul>
            <ul class="marquee-group" aria-hidden="true">
                <li>Oie</li>
                <li>Tudo bem?</li>
                <li>Como ta?</li>
                <li>Opa</li>
            </ul>
        </div>
    </div>
</body>

</html>
