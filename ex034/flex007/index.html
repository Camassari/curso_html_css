<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        body {
            background-color: rgb(31, 31, 224);
        }

        div#container {
            background-color: white;

            display: flex;
            flex-flow: row nowrap;
        
            margin-bottom: 10px;
            height: 50px;
        }

        div#item {
            flex-basis: 150px;
            text-align: center;

            background-color: yellow;
            border: 3px solid rgb(0, 0, 82);
        }

        div.cxA {
            flex-grow: 0;
            flex-shrink: 1;
        }

        div.cxB {
            flex-grow: 2;
            flex-shrink: 0;
        }
        
        div.cxC {
            flex-grow: 1;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div id="container" class="cnt1">
        <div id="item" class="cxA"></div>
        <div id="item" class="cxB"></div>
        <div id="item" class="cxC"></div>
    </div>
</body>
</html>
