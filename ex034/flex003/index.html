<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        }

        body {
            background-color: lightcoral;
        }

        main {
            background-color: lightblue;
            width: 90vw;
            height: 90vh;

            display: flex;
            flex-flow: row nowrap;
            align-items: center;
            justify-content: center;
        }

        section {
            background-color: lightgreen;
            width: 200px;
            height: 200px;
        }

        h1 {
            font-size: 2em;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
</body>
</html>
