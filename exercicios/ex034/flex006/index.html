<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            width: 100vw;
        }

        main {
            height: 100vh;
            width: 100vw;
        }
        
        div#container {
            background-color: lightcoral;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
            height: 300px;
        }

        div#item {
            padding: 25px;
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        div.i1 {
            order: 0;
            align-self: center;
        }
        div.i2 {
            order: -5;
            align-self: flex-end;
        }
        div.i3 {
            order: 0;
        }
        div.i4 {
            order: 4;
        }
        div.i5 {
            order: -2;
        }
        div.i6 {
            order: 3;
        }
        div.i7 {
            order: 0;
        }
        div.i8 {
            order: 1;
            align-self: stretch;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <div id="container">
                <div id="item" class="i1">A</div>
                <div id="item" class="i2">B</div>
                <div id="item" class="i3">C</div>
                <div id="item" class="i4">D</div>
                <div id="item" class="i5">E</div>
                <div id="item" class="i6">F</div>
                <div id="item" class="i7">G</div>
                <div id="item" class="i8">H</div>
            </div>
        </section>
    </main>
</body>
</html>
